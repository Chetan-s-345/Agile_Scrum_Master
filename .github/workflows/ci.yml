name: GitHub CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Resolve cloud app directory
        id: cloud-dir
        shell: bash
        run: |
          if [[ -f "cloud/package.json" ]]; then
            echo "app_dir=cloud" >> "$GITHUB_OUTPUT"
            echo "legacy_root=false" >> "$GITHUB_OUTPUT"
          elif [[ -f "package.json" ]]; then
            echo "app_dir=." >> "$GITHUB_OUTPUT"
            echo "legacy_root=true" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find package.json for cloud app."
            exit 1
          fi

      - name: Install cloud dependencies
        working-directory: ${{ steps.cloud-dir.outputs.app_dir }}
        run: npm ci

      - name: Lint cloud
        shell: bash
        working-directory: ${{ steps.cloud-dir.outputs.app_dir }}
        run: |
          if [[ "${{ steps.cloud-dir.outputs.legacy_root }}" == "true" ]]; then
            npm run lint -- --ignore-pattern desktop/**
          else
            npm run lint
          fi

      - name: Build cloud
        working-directory: ${{ steps.cloud-dir.outputs.app_dir }}
        run: npm run build

  desktop-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/frontend/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install desktop frontend dependencies
        working-directory: desktop
        run: npm ci --prefix frontend

      - name: Lint desktop
        working-directory: desktop
        run: npm run lint

      - name: Build desktop
        working-directory: desktop
        run: npm run build
