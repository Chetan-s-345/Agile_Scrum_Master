name: GitHub CD

on:
  workflow_run:
    workflows:
      - GitHub CI
    types:
      - completed
    branches:
      - production
      - Production
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: all
        options:
          - all
          - vercel
          - render

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  pre-deploy-checks:
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'production' || github.event.workflow_run.head_branch == 'Production'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Resolve cloud app directory
        id: cloud-dir
        shell: bash
        run: |
          if [[ -f "cloud/package.json" ]]; then
            echo "app_dir=cloud" >> "$GITHUB_OUTPUT"
            echo "legacy_root=false" >> "$GITHUB_OUTPUT"
          elif [[ -f "package.json" ]]; then
            echo "app_dir=." >> "$GITHUB_OUTPUT"
            echo "legacy_root=true" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find package.json for cloud app."
            exit 1
          fi

      - name: Install cloud dependencies
        working-directory: ${{ steps.cloud-dir.outputs.app_dir }}
        run: npm ci

      - name: Lint cloud
        shell: bash
        working-directory: ${{ steps.cloud-dir.outputs.app_dir }}
        run: |
          if [[ "${{ steps.cloud-dir.outputs.legacy_root }}" == "true" ]]; then
            npm run lint -- --ignore-pattern desktop/**
          else
            npm run lint
          fi

      - name: Build cloud
        working-directory: ${{ steps.cloud-dir.outputs.app_dir }}
        run: npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install desktop frontend dependencies
        working-directory: desktop
        run: npm ci --prefix frontend

      - name: Lint desktop
        working-directory: desktop
        run: npm run lint

      - name: Build desktop
        working-directory: desktop
        run: npm run build

  vercel-deploy:
    needs: pre-deploy-checks
    if: >
      needs.pre-deploy-checks.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'vercel')) ||
      github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Resolve cloud app directory
        id: cloud-dir
        shell: bash
        run: |
          if [[ -f "cloud/package.json" ]]; then
            echo "app_dir=cloud" >> "$GITHUB_OUTPUT"
            echo "legacy_root=false" >> "$GITHUB_OUTPUT"
          elif [[ -f "package.json" ]]; then
            echo "app_dir=." >> "$GITHUB_OUTPUT"
            echo "legacy_root=true" >> "$GITHUB_OUTPUT"
          else
            echo "Could not find package.json for cloud app."
            exit 1
          fi

      - name: Install cloud dependencies
        working-directory: ${{ steps.cloud-dir.outputs.app_dir }}
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Resolve Vercel environment
        id: vercel-env
        shell: bash
        run: |
          echo "environment=production" >> "$GITHUB_OUTPUT"
          echo "flags=--prod" >> "$GITHUB_OUTPUT"

      - name: Pull Vercel environment
        working-directory: ${{ steps.cloud-dir.outputs.app_dir }}
        run: vercel pull --yes --environment=${{ steps.vercel-env.outputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel output
        working-directory: ${{ steps.cloud-dir.outputs.app_dir }}
        run: vercel build ${{ steps.vercel-env.outputs.flags }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        working-directory: ${{ steps.cloud-dir.outputs.app_dir }}
        run: vercel deploy --prebuilt ${{ steps.vercel-env.outputs.flags }} --token=${{ secrets.VERCEL_TOKEN }}

  render-deploy:
    needs: pre-deploy-checks
    if: >
      needs.pre-deploy-checks.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'render')) ||
      github.event_name == 'workflow_run')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render API Gateway deploy
        shell: bash
        env:
          RENDER_API_GATEWAY_DEPLOY_HOOK_URL: ${{ secrets.RENDER_API_GATEWAY_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "${RENDER_API_GATEWAY_DEPLOY_HOOK_URL}" ]]; then
            echo "Missing secret RENDER_API_GATEWAY_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl --fail --show-error --silent -X POST "${RENDER_API_GATEWAY_DEPLOY_HOOK_URL}"

      - name: Trigger Render AI Service deploy
        shell: bash
        env:
          RENDER_AI_SERVICE_DEPLOY_HOOK_URL: ${{ secrets.RENDER_AI_SERVICE_DEPLOY_HOOK_URL }}
        run: |
          if [[ -z "${RENDER_AI_SERVICE_DEPLOY_HOOK_URL}" ]]; then
            echo "Missing secret RENDER_AI_SERVICE_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl --fail --show-error --silent -X POST "${RENDER_AI_SERVICE_DEPLOY_HOOK_URL}"
