<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/sprint-grid-logo.svg" />
    <title>Agile Scrum Master Desktop</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sprint-theme');
          var parsed = stored ? JSON.parse(stored) : null;
          var theme = parsed && parsed.state && parsed.state.theme === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
