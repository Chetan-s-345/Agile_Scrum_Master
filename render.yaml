services:
  - type: redis
    name: asm-redis
    plan: free
    ipAllowList: []

  - type: web
    name: asm-api-gateway
    runtime: node
    rootDir: backend/api-gateway
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: REDIS_URL
        fromService:
          type: redis
          name: asm-redis
          property: connectionString
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: ENABLE_WORKERS
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: UNIVERSAL_DATABASE_URL
        sync: false
      - key: TENANT_DB_PROVISIONING_MODE
        value: manual
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: asm-ai-service
          property: url
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: JIRA_CLIENT_ID
        sync: false
      - key: JIRA_CLIENT_SECRET
        sync: false

  - type: web
    name: asm-ai-service
    runtime: python
    rootDir: backend/ai-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: OPENAI_API_KEY
        sync: false
